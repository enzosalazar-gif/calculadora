<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora API</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="calculator-card">
    <h2>Calculadora via API</h2>
    
    <div class="input-group">
      <label for="num1">Primeiro Número:</label>
      <input type="number" id="num1" placeholder="Ex: 10" step="any">
    </div>

    <div class="input-group">
      <label for="num2">Segundo Número:</label>
      <input type="number" id="num2" placeholder="Ex: 5" step="any">
    </div>

    <!-- Botões chamando as funções individuais -->
    <div class="buttons-grid">
      <button onclick="somar()">+</button>
      <button onclick="subtrair()">-</button>
      <button onclick="multiplicar()">×</button>
      <button onclick="dividir()">÷</button>
    </div>

    <!-- Exibição do Resultado -->
    <div class="result-box" id="resultBox">
      <span>Resultado:</span>
      <strong id="resultValue">--</strong>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
